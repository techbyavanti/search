version: 2
updates:
  # Root reactor pom.xml manages versions for every module (search-common,
  # search-inference, search-retrieval, search-ingestion, search-api,
  # search-eval) via dependencyManagement, so one entry at "/" covers all six.
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # Model runtimes change scores (ONNX Runtime kernels, tokenization), so
      # they come in their own PR: merge it only with a fresh eval run that
      # regenerates RESULTS.md. They are excluded from maven-patch-minor below.
      model-runtime:
        patterns:
          - "com.microsoft.onnxruntime:*"
          - "ai.djl.huggingface:*"
      maven-patch-minor:
        update-types:
          - minor
          - patch
        exclude-patterns:
          - "com.microsoft.onnxruntime:*"
          - "ai.djl.huggingface:*"
    ignore:
      # The Java client must not be newer than the Elasticsearch server
      # (docker-compose.yml). Upgrade both together, by hand.
      - dependency-name: "co.elastic.clients:elasticsearch-java"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # Jackson follows the minor lines Spring Boot is built against; patch
      # releases (CVE fixes) still come through.
      - dependency-name: "com.fasterxml.jackson:jackson-bom"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "tools.jackson:jackson-bom"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    open-pull-requests-limit: 10

  - package-ecosystem: docker
    directory: "/search-api"
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
